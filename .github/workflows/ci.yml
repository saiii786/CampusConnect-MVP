# Continuous integration: runs on every push and pull request.
# Lint, typecheck, unit tests and API integration tests (against a throwaway Postgres).
# A red CI blocks merging (docs/ROADMAP.md Definition of Done).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc_ci_only
          POSTGRES_DB: campusconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cc -d campusconnect_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://cc:cc_ci_only@localhost:5432/campusconnect_test
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (also generates the Prisma client)
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (shared, backend, mobile)
        run: npm test

      - name: API integration tests
        run: npm run test:e2e -w @cc/backend
