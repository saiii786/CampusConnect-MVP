# Render Blueprint for the Connect API (ROADMAP T10.2, ADR-031). Free plan: sleeps after ~15 min idle,
# first request after that takes up to a minute (the in-process jobs catch up 30 s after waking).
#
# Deploy: Render dashboard → New → Blueprint → pick this GitHub repo → fill the values marked
# `sync: false` (Render asks for them; they are never stored in git). See docs/RUNBOOK.md.
#
# Migrations are NOT run on deploy (founder rule: migrations are reviewed and applied deliberately):
#   npm run db:deploy -w @cc/backend   (with the Supabase settings, see docs/RUNBOOK.md)
services:
  - type: web
    name: connect-api
    runtime: node
    plan: free
    region: singapore # closest to India and to the Supabase project (ap-southeast-1)
    branch: main
    autoDeploy: false # deploy on purpose: Manual Deploy in the dashboard
    healthCheckPath: /api/v1/health
    # Only the API and the shared package — the Expo app is not installed on the server.
    buildCommand: npm ci --workspace @cc/shared --workspace @cc/backend --include-workspace-root && npm run build:shared && npm run build -w @cc/backend
    startCommand: npm run start:prod -w @cc/backend
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: log

      # ── Database (Supabase) ─────────────────────────────────────────────
      - key: DATABASE_URL # transaction pooler, port 6543 (IPv4)
        sync: false
      - key: DIRECT_URL # session pooler, port 5432 (IPv4) — only used for migrations
        sync: false
      - key: DATABASE_CA_CERT_PATH # verify the database's TLS certificate
        value: certs/supabase-prod-ca-2021.crt

      # ── Auth secrets: generated by Render, never typed by a person ──────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CODE_HASH_SECRET
        generateValue: true

      # ── Email (Brevo) ───────────────────────────────────────────────────
      - key: MAIL_DRIVER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Connect

      # ── Photos (Supabase Storage) ───────────────────────────────────────
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        value: https://neoijibrnmnxloymnwjs.supabase.co
      - key: STORAGE_BUCKET
        value: media
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Payments: Razorpay TEST mode only (rzp_test_ keys; live keys are refused) ──
      - key: PAYMENT_GATEWAY
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_API_URL # e.g. https://connect-api.onrender.com (shown on the service page after creation)
        sync: false

      # ── Notifications and jobs ──────────────────────────────────────────
      - key: PUSH_DRIVER
        value: expo
      - key: JOBS_ENABLED
        value: "true"
